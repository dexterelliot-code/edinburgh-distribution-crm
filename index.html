<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caledonia Technical Partners CRM</title>
  <meta name="description" content="Manufacturer outreach, email and proposal CRM for Caledonia Technical Partners." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">CTP</div>
      <div>
        <strong>Caledonia</strong>
        <span>Technical Partners</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="secondary" id="exportDataBtn">Export Data</button>
      <label class="secondary file-label">
        Import Data
        <input id="importDataInput" type="file" accept="application/json" />
      </label>
      <button class="primary" id="newCompanyBtn">+ New Company</button>
    </div>
  </header>

  <main class="shell">
    <section class="stats" id="stats"></section>

    <section class="toolbar card">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search manufacturers, contacts, categories…" />
      </div>
      <select id="statusFilter">
        <option value="">All stages</option>
        <option>Research</option>
        <option>Email Drafted</option>
        <option>Email Sent</option>
        <option>Follow-up Due</option>
        <option>Replied</option>
        <option>Meeting Booked</option>
        <option>Proposal Sent</option>
        <option>Negotiation</option>
        <option>Won</option>
        <option>Lost</option>
      </select>
      <select id="priorityFilter">
        <option value="">All priorities</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
      </select>
    </section>

    <section class="layout">
      <aside class="card company-list-panel">
        <div class="panel-heading">
          <div>
            <h2>Manufacturers</h2>
            <p id="companyCount">0 companies</p>
          </div>
        </div>
        <div id="companyList" class="company-list"></div>
      </aside>

      <section class="card workspace">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">CTP</div>
          <h2>Select a manufacturer</h2>
          <p>Choose a company from the left, or add a new prospect to begin.</p>
        </div>

        <div id="workspaceContent" hidden>
          <div class="workspace-header">
            <div>
              <span id="companyStageBadge" class="badge"></span>
              <h1 id="workspaceCompanyName"></h1>
              <a id="workspaceWebsite" target="_blank" rel="noreferrer"></a>
            </div>
            <div class="workspace-actions">
              <button class="secondary" id="deleteCompanyBtn">Delete</button>
              <button class="primary" id="saveCompanyBtn">Save</button>
            </div>
          </div>

          <nav class="tabs" aria-label="CRM workspace tabs">
            <button class="tab active" data-tab="profile">Company</button>
            <button class="tab" data-tab="email">Email Studio</button>
            <button class="tab" data-tab="proposal">Proposal Generator</button>
            <button class="tab" data-tab="activity">Activity</button>
          </nav>

          <section class="tab-panel active" id="profilePanel">
            <div class="form-grid">
              <label>Company name<input id="companyName" /></label>
              <label>Website<input id="website" type="url" placeholder="https://…" /></label>
              <label>Country<input id="country" /></label>
              <label>Product category<input id="category" /></label>
              <label>Contact name<input id="contactName" /></label>
              <label>Job title<input id="contactRole" /></label>
              <label>Email<input id="contactEmail" type="email" /></label>
              <label>LinkedIn<input id="linkedin" type="url" /></label>
              <label>Priority
                <select id="priority"><option>A</option><option>B</option><option>C</option></select>
              </label>
              <label>Pipeline stage
                <select id="stage">
                  <option>Research</option><option>Email Drafted</option><option>Email Sent</option>
                  <option>Follow-up Due</option><option>Replied</option><option>Meeting Booked</option>
                  <option>Proposal Sent</option><option>Negotiation</option><option>Won</option><option>Lost</option>
                </select>
              </label>
              <label class="full">Why this company is a fit
                <textarea id="fitReason" rows="3" placeholder="What makes the manufacturer relevant to Scotland?"></textarea>
              </label>
              <label class="full">Product / company notes
                <textarea id="notes" rows="5"></textarea>
              </label>
            </div>
          </section>

          <section class="tab-panel" id="emailPanel">
            <div class="split">
              <div>
                <h3>Quick personalisation</h3>
                <div class="form-grid single">
                  <label>Specific product or capability
                    <input id="emailProduct" placeholder="e.g. AI sports cameras" />
                  </label>
                  <label>Scottish opportunity
                    <textarea id="emailOpportunity" rows="3" placeholder="e.g. grassroots football venues, universities and sports centres"></textarea>
                  </label>
                  <label>Call to action
                    <select id="emailCTA">
                      <option value="call">15-minute introductory call</option>
                      <option value="reply">Reply by email</option>
                      <option value="proposal">Review a short market proposal</option>
                    </select>
                  </label>
                  <label>Email type
                    <select id="emailType">
                      <option value="intro">Initial introduction</option>
                      <option value="follow1">Follow-up 1</option>
                      <option value="follow2">Follow-up 2</option>
                      <option value="proposal">Proposal follow-up</option>
                    </select>
                  </label>
                </div>
                <div class="button-row">
                  <button class="primary" id="generateEmailBtn">Generate Email</button>
                  <button class="secondary" id="markSentBtn">Mark as Sent</button>
                </div>
              </div>

              <div class="composer">
                <label>Subject<input id="emailSubject" /></label>
                <label>Message<textarea id="emailBody" rows="18"></textarea></label>
                <div class="button-row wrap">
                  <button class="secondary" id="copyEmailBtn">Copy Email</button>
                  <button class="secondary" id="openGmailBtn">Open Gmail</button>
                  <button class="secondary" id="openMailBtn">Open Mail App</button>
                </div>
                <p class="hint">Gmail opens a pre-filled compose window. Review before sending.</p>
              </div>
            </div>
          </section>

          <section class="tab-panel" id="proposalPanel">
            <div class="proposal-controls">
              <div class="form-grid">
                <label>Territory
                  <input id="proposalTerritory" value="Scotland" />
                </label>
                <label>Commercial model
                  <select id="commercialModel">
                    <option>Commission-based sales representation</option>
                    <option>Monthly retainer plus commission</option>
                    <option>Non-exclusive distribution partnership</option>
                    <option>Exclusive territory representation</option>
                    <option>Market-entry pilot</option>
                  </select>
                </label>
                <label>Commission / terms
                  <input id="commercialTerms" placeholder="e.g. 10% commission on net sales" />
                </label>
                <label>Proposal validity
                  <input id="proposalValidity" value="30 days" />
                </label>
                <label class="full">Target sectors
                  <input id="targetSectors" placeholder="e.g. sport, education, local authorities, leisure centres" />
                </label>
                <label class="full">Proposed services
                  <textarea id="proposalServices" rows="4">Local sales representation
Qualified lead generation
Customer and partner meetings
Product demonstrations
Market feedback and reporting
Ongoing opportunity management</textarea>
                </label>
              </div>
              <div class="button-row">
                <button class="primary" id="generateProposalBtn">Generate Proposal</button>
                <button class="secondary" id="printProposalBtn">Save / Print PDF</button>
              </div>
            </div>

            <article id="proposalPreview" class="proposal-preview"></article>
          </section>

          <section class="tab-panel" id="activityPanel">
            <div class="activity-entry">
              <input id="activityNote" placeholder="Add a note, call outcome or next step…" />
              <button class="primary" id="addActivityBtn">Add Activity</button>
            </div>
            <div id="activityList" class="activity-list"></div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <dialog id="companyDialog">
    <form method="dialog" id="companyDialogForm">
      <h2>Add manufacturer</h2>
      <label>Company name<input id="newCompanyName" required /></label>
      <label>Website<input id="newCompanyWebsite" type="url" placeholder="https://…" /></label>
      <label>Contact email<input id="newCompanyEmail" type="email" /></label>
      <div class="button-row end">
        <button value="cancel" class="secondary">Cancel</button>
        <button value="default" id="createCompanyBtn" class="primary">Create</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
